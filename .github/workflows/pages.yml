name: Deploy MuJoCo Franka demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Three.js
        run: npm ci --ignore-scripts

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html favicon.ico site_config.js _site/
          for dir in app assets backend bridge core environment model plugins renderer spec ui worker local_model dist node_modules/three; do
            cp -R "$dir" "_site/$dir"
          done
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
